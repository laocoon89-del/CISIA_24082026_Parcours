# Cree une commande "indusense" qui appelle la fonction main() du module CLI.
# Apres installation, taper `indusense` dans un terminal lancera ce point d'entree.
# [PÉDAGOGIE] SECTION — `[project.scripts]` regroupe des réglages lus par le même outil ou
# [PÉDAGOGIE] composant.
[project.scripts]
# [PÉDAGOGIE] RÉGLAGE `indusense` — valeur déclarative lue par l'outil associé à cette section.
