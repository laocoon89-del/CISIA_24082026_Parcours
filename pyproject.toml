# --- [tool.hatch.build.targets.wheel] : ou trouver le code a empaqueter ------
# Indique a hatchling que le code source du paquet se trouve dans src/indusense.
# [PÉDAGOGIE] SECTION — `[tool.hatch.build.targets.wheel]` regroupe des réglages lus par le même
# [PÉDAGOGIE] outil ou composant.
[tool.hatch.build.targets.wheel]
# [PÉDAGOGIE] RÉGLAGE `packages` — valeur déclarative lue par l'outil associé à cette section.
packages = ["src/indusense"]

# --- [tool.ruff] : configuration du linter ruff -----------------------------
# [PÉDAGOGIE] SECTION — `[tool.ruff]` regroupe des réglages lus par le même outil ou composant.
[tool.ruff]
# Largeur de ligne maximale toleree (au-dela : avertissement de style).
# [PÉDAGOGIE] STYLE — partage la même limite entre formateur, apprenants et CI.
line-length = 100
# Version de Python ciblee pour les regles d'analyse (ici 3.13).
# [PÉDAGOGIE] RÉGLAGE `target-version` — valeur déclarative lue par l'outil associé à cette
# [PÉDAGOGIE] section.
target-version = "py313"
# Dossiers a EXCLURE de l'analyse (environnements virtuels, dossiers de build).
# [PÉDAGOGIE] RÉGLAGE `extend-exclude` — valeur déclarative lue par l'outil associé à cette
# [PÉDAGOGIE] section.
extend-exclude = [".venv*", "venv*", "dist", "build"]

# --- [tool.ruff.lint] : quelles familles de regles ruff active-t-on ---------
# [PÉDAGOGIE] SECTION — `[tool.ruff.lint]` regroupe des réglages lus par le même outil ou
# [PÉDAGOGIE] composant.
[tool.ruff.lint]
# Regles activees :
#   E = erreurs de style (pycodestyle), F = erreurs logiques (pyflakes),
#   I = tri des imports (isort), UP = modernisation du code (pyupgrade),
#   B = pieges courants (flake8-bugbear).
# [PÉDAGOGIE] RÉGLAGE `select` — valeur déclarative lue par l'outil associé à cette section.
select = ["E", "F", "I", "UP", "B"]
# Regle volontairement IGNOREE : B008 (appel de fonction comme valeur par defaut),
# car c'est un usage normal et recommande avec typer/FastAPI.
# [PÉDAGOGIE] RÉGLAGE `ignore` — valeur déclarative lue par l'outil associé à cette section.
ignore = ["B008"]

# --- [tool.black] : configuration du formateur black ------------------------
# [PÉDAGOGIE] SECTION — `[tool.black]` regroupe des réglages lus par le même outil ou composant.
[tool.black]
# Meme largeur de ligne que ruff (les deux outils restent coherents).
# [PÉDAGOGIE] STYLE — partage la même limite entre formateur, apprenants et CI.
line-length = 100

# --- [tool.pytest.ini_options] : configuration des tests pytest -------------
# [PÉDAGOGIE] SECTION — `[tool.pytest.ini_options]` regroupe des réglages lus par le même outil ou
# [PÉDAGOGIE] composant.
[tool.pytest.ini_options]
# Dossier ou pytest cherchera les tests.
# [PÉDAGOGIE] COLLECTE — évite qu'un exercice autonome soit exécuté accidentellement avec la suite
# [PÉDAGOGIE] racine.
testpaths = ["tests"]
# Ajoute "src" au chemin d'import Python => les tests trouvent le code source.
# [PÉDAGOGIE] RÉGLAGE `pythonpath` — valeur déclarative lue par l'outil associé à cette section.
pythonpath = ["src"]
