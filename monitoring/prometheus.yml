# [PÉDAGOGIE] ============================================================================
# [PÉDAGOGIE] FICHIER — monitoring/prometheus.yml
# [PÉDAGOGIE] MODULE  — M28 puis M33–M34 — collecte de métriques
# [PÉDAGOGIE] RÔLE    — Configurer le modèle pull de Prometheus et rendre les cibles de
# [PÉDAGOGIE]           supervision explicites.
# [PÉDAGOGIE] THÉORIE — une métrique est échantillonnée ; elle ne remplace ni les logs ni les
# [PÉDAGOGIE]           traces
# [PÉDAGOGIE]           • scrape_interval règle la fréquence d'observation, pas la fréquence des
# [PÉDAGOGIE]             événements
# [PÉDAGOGIE]           • les labels doivent rester peu nombreux pour maîtriser la cardinalité
# [PÉDAGOGIE] À VOIR  — La page Targets de Prometheus doit montrer une cible UP et expliquer toute
# [PÉDAGOGIE]           cible DOWN.
# [PÉDAGOGIE] PIÈGE   — Une cible préconfigurée peut être volontairement inactive ; ne pas la
# [PÉDAGOGIE]           confondre avec une panne avérée.
# [PÉDAGOGIE] GARDE   — Toutes les lignes marquées [PÉDAGOGIE] sont des commentaires : elles
# [PÉDAGOGIE]           guident la lecture sans changer l'exécution.
# [PÉDAGOGIE] ============================================================================

# =============================================================================
#  FICHIER : monitoring/prometheus.yml
#  RÔLE    : configuration de Prometheus, l'outil qui SURVEILLE l'application en
#            COLLECTANT régulièrement ses "métriques" (nombre de requêtes, temps
#            de réponse, erreurs, etc.). C'est la base du monitoring/observabilité.
#  MODULE  : 33-34 (monitoring / Prometheus).
#
#  COMMENT MARCHE PROMETHEUS (modèle "PULL") :
#    - Prometheus ne PAS attend qu'on lui envoie des données : c'est LUI qui va les
#      CHERCHER ("to scrape" = aspirer). À intervalle régulier, il appelle une URL
#      spéciale de l'application (souvent /metrics) et lit les chiffres exposés.
#    - C'est l'inverse d'un modèle "PUSH" où l'appli enverrait ses métriques.
#      Avantage du PULL : Prometheus contrôle le rythme et sait si une cible ne
#      répond plus (= panne détectée).
#
#  ⚠️ RAPPEL YAML : l'indentation (espaces) structure le fichier. On n'y touche
#     pas. Ici on n'ajoute QUE des commentaires '#'.
# =============================================================================

# [PÉDAGOGIE] CLÉ `global` — ce champ déclaratif participe au contrat de configuration.
global:                   # 'global' = réglages par défaut qui s'appliquent à TOUT Prometheus.
  # [PÉDAGOGIE] CLÉ `scrape_interval` — ce champ déclaratif participe au contrat de configuration.
  scrape_interval: 15s    # Fréquence de collecte par défaut : Prometheus va "aspirer" les
                          #   métriques toutes les 15 secondes. Plus court = plus précis mais
                          #   plus de charge ; plus long = moins fin mais plus léger.

# [PÉDAGOGIE] COLLECTE — chaque job regroupe des cibles interrogées selon la même politique.
scrape_configs:           # 'scrape_configs' = la LISTE des cibles à surveiller (les "jobs").
  # [PÉDAGOGIE] CLÉ `job_name` — ce champ déclaratif participe au contrat de configuration.
  - job_name: indusense-api     # Nom logique de ce job de collecte (sert d'étiquette dans Prometheus).
    # [PÉDAGOGIE] CLÉ `metrics_path` — ce champ déclaratif participe au contrat de configuration.
    metrics_path: /metrics      # CHEMIN de l'URL où l'appli expose ses métriques (ici .../metrics).
                          #   Prometheus appellera donc http://<cible>/metrics pour lire les chiffres.
    # [PÉDAGOGIE] DÉCOUVERTE — la liste des cibles est ici déclarée explicitement.
    static_configs:             # Cibles définies "en dur" (liste fixe d'adresses, sans découverte auto).
      # [PÉDAGOGIE] CIBLES — utiliser le nom DNS du service depuis le réseau Docker, pas
      # [PÉDAGOGIE] localhost.
      - targets: ["api:8000"]   # CIBLE à interroger : le service 'api' sur le port 8000.
                          #   'api' est résolu par le DNS interne de Docker Compose (nom du service)
                          #   -> Prometheus scrape http://api:8000/metrics. C'est le modèle PULL en action.

  # --- Job ajouté (TP drift m31) : l'exporteur tourne SUR LE POSTE (pas dans
  # Docker) → on le joint via host.docker.internal (Docker Desktop Win/macOS ;
  # sous Linux, ajouter extra_hosts: ["host.docker.internal:host-gateway"] au
  # service prometheus du docker-compose).
  # [PÉDAGOGIE] CLÉ `job_name` — ce champ déclaratif participe au contrat de configuration.
  - job_name: indusense-drift
    # [PÉDAGOGIE] DÉCOUVERTE — la liste des cibles est ici déclarée explicitement.
    static_configs:
      # [PÉDAGOGIE] CIBLES — utiliser le nom DNS du service depuis le réseau Docker, pas
      # [PÉDAGOGIE] localhost.
      - targets: ["host.docker.internal:9109"]
