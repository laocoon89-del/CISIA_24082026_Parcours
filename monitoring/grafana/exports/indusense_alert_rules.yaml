apiVersion: 1
groups:
    - orgId: 1
      name: indusense-m34
      folder: InduSense alertes
      interval: 10s
      rules:
        - uid: prod-p95
          title: PROD — Latence p95 > 300 ms
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler="/predict-tabular"}[5m])) by (le))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.3
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            runbook_url: docs/runbook.md
            summary: 'SLO 3 menacé : p95 de /predict-tabular au-dessus de 300 ms depuis 5 min'
          labels:
            service: indusense-api
            severity: warning
          isPaused: false
        - uid: prod-5xx
          title: PROD — Erreurs 5xx > 1 %
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0)) / sum(rate(http_requests_total[5m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.01
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            runbook_url: docs/runbook.md
            summary: 'SLO 4 menacé : plus de 1 % de 5xx depuis 5 min'
          labels:
            service: indusense-api
            severity: critical
          isPaused: false
        - uid: exo-api-down
          title: EXERCICE — API morte (up < 1)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: up{job="indusense-api"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 1m
          annotations:
            runbook_url: docs/runbook.md
            summary: Prometheus ne joint plus l'API depuis 1 min
          labels:
            service: indusense-api
            severity: critical
          isPaused: false
        - uid: exo-401
          title: EXERCICE — Pic de 401
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: sum(rate(http_requests_total{status="401"}[1m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.2
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            runbook_url: docs/runbook.md
            summary: Plus de 0,2 requête/s refusée pour clé absente ou invalide depuis 1 min
          labels:
            service: indusense-api
            severity: warning
          isPaused: false
